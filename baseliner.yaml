# baseliner control config for the baselinerhq organization.
# Scanned weekly by .github/workflows/baseliner.yml.
scope:
  github:
    type: org
    name: baselinerhq
  # This control repo is the scanner's home, not a scanned project.
  exclude:
    - baseliner-control
policy:
  base: default
  # Infra repos aren't software projects: the org profile repo (.github) and the
  # auto-generated Homebrew tap legitimately have no CI, CODEOWNERS, dependency
  # manifests, or .gitignore. Waive only those; everything else still applies.
  # The profile repo also changes rarely by design, so staleness is not drift.
  repo_ignores:
    "baselinerhq/.github":
      - ci_present
      - codeowners_exists
      - dependency_update_config
      - gitignore_exists
      - stale_repo
    "baselinerhq/homebrew-tap":
      - ci_present
      - codeowners_exists
      - dependency_update_config
      - gitignore_exists

# Privacy guard: this control repo is public and its token can read private
# repos. Drop private/internal repos from the public output entirely, rather than
# redacting them to a private/N row that still shows their existence and score.
# The exit code still counts them, and a private repo's findings cannot be
# waived here without naming it in this public file (baselinerhq/baseliner#75;
# a visibility-scoped waiver is baselinerhq/baseliner#98). See:
# https://baselinerhq.github.io/configuration#privacy-guard
privacy:
  public_context: true
  private_repos: exclude
